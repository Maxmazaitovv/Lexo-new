const GRM=[
["1. Zamonlar jadvali (12 zamon)","Present · Past · Future  ×  Simple · Continuous · Perfect · Perfect Continuous","Inglizchada 3 vaqt (hozirgi, o'tgan, kelasi) bor va har birida 4 ko'rinish: Simple (oddiy ish), Continuous (davom etayotgan), Perfect (tugagan, natijali), Perfect Continuous (davomiylik). Jami 12 zamon.",[["I work. · I am working.", "Ishlayman. · Ishlayapman."], ["I have worked. · I have been working.", "Ishlab bo'ldim. · Ishlab kelyapman."], ["I worked. · I was working.", "Ishladim. · Ishlayotgan edim."], ["I had worked. · I had been working.", "Ishlagan edim. · Ishlab kelayotgan edim."], ["I will work. · I will be working.", "Ishlayman. · Ishlayotgan bo'laman."], ["I will have worked. · I will have been working.", "Ishlab bo'lgan bo'laman. · Ishlab kelgan bo'laman."]],"Simple = V · Continuous = be + V-ing · Perfect = have + V3 · Perfect Continuous = have been + V-ing."],
["2. To be: am / is / are","I am · he / she / it is · we / you / they are","Bu «bo'lmoq» fe'li. Kim ekanini, qandayligini yoki qayerdaligini aytish uchun kerak. Inglizchada gapda doim fe'l bo'ladi, shuning uchun «Men talabaman» deganda ham am qo'shiladi.",[["I am a student.","Men talabaman."],["She is at home.","U uyda."],["They are happy.","Ular xursand."]],"Inkor: am/is/are + not. Savol: fe'l gap boshiga chiqadi: Are you ready?"],
["3. Present Simple","I / you / we / they + V · he / she / it + V+s","Har kuni takrorlanadigan ishlar, odatlar va doimiy haqiqatlar uchun. U (he, she, it) bilan fe'lga -s qo'shiladi. Inkor: don't / doesn't + V. Savol: Do / Does + ega + V?",[["She works every day.","U har kuni ishlaydi."],["I don't like tea.","Men choyni yoqtirmayman."],["Does he speak English?","U inglizcha gapiradimi?"]],"Does/doesn't dan keyin -s yo'q: He doesn't work ✅. Belgilari: every day, usually, always, often."],
["4. Present Continuous","am / is / are + V-ing","Aynan hozir, shu daqiqada bo'layotgan ish uchun. Yaqin rejalarni aytishda ham ishlatiladi.",[["I am studying now.","Men hozir o'qiyapman."],["They are not sleeping.","Ular uxlamayapti."],["What are you doing?","Nima qilyapsiz?"]],"Belgilari: now, at the moment, right now, Look!"],
["5. Present Perfect","have / has + V3","O'tmishda boshlangan, lekin hozirga aloqasi bor ish. Natija muhim, qachon bo'lgani muhim emas.",[["I have finished my homework.","Men uy vazifamni tugatdim."],["She has lived here for 5 years.","U bu yerda 5 yildan beri yashaydi."],["Have you ever been to Paris?","Siz Parijda bo'lganmisiz?"]],"Belgilari: ever, never, already, yet, just, for, since. Yesterday bilan ishlatilmaydi."],
["6. Present Perfect Continuous","have / has been + V-ing","O'tmishda boshlanib hozirgacha davom etayotgan yoki hozirgina tugagan, izi ko'rinib turgan ish. Qancha vaqt davom etgani muhim.",[["I have been studying for two hours.", "Men ikki soatdan beri o'qiyapman."], ["She has been working here since 2020.", "U 2020-yildan beri shu yerda ishlaydi."], ["It has been raining all day.", "Kun bo'yi yomg'ir yog'yapti."], ["I'm tired. I have been running.", "Charchadim. Yugurib keldim."]],"Belgilari: for, since, all day, lately, recently, How long...? Know, like kabi fe'llar Continuous bo'lmaydi."],
["7. Past Simple","V2 (-ed yoki 2-shakl) · did + V","O'tmishda tugagan ish. Qachon bo'lgani ma'lum yoki aytilgan. To'g'ri fe'llarga -ed qo'shiladi, noto'g'rilarning 2-shakli alohida (go → went).",[["I visited Tashkent last year.","Men o'tgan yili Toshkentga bordim."],["He went home.","U uyga ketdi."],["Did you see her?","Siz uni ko'rdingizmi?"]],"Did dan keyin 1-shakl: Did you go ✅ (went emas). Belgilari: yesterday, last week, ago."],
["8. Past Continuous","was / were + V-ing","O'tmishda ma'lum paytda davom etayotgan ish. Ko'pincha boshqa ish bilan birga aytiladi.",[["I was reading at 8 o'clock.","Soat 8 da men kitob o'qiyotgan edim."],["They were playing when it rained.","Yomg'ir yog'ganda ular o'ynayotgan edi."]],"when — qisqa ish, while — uzoq ish: While I was cooking, he called."],
["9. Past Perfect","had + V3","O'tmishdagi ikki ishdan avval bo'lgan ishi uchun. «O'sha paytgacha allaqachon qilib bo'lgan edi» ma'nosi.",[["When I arrived, the film had started.", "Men kelganimda film boshlangan edi."], ["She had already left when I called.", "Qo'ng'iroq qilganimda u allaqachon ketgan edi."], ["I hadn't eaten before the exam.", "Imtihondan oldin ovqat yemagan edim."], ["Had you seen him before?", "Siz uni avval ko'rganmidingiz?"]],"Belgilari: already, before, by the time, after. Avval bo'lgan ish — Past Perfect, keyingisi — Past Simple."],
["10. Past Perfect Continuous","had been + V-ing","O'tmishdagi biror paytgacha davom etib kelgan ish. Qancha vaqt davom etgani ta'kidlanadi.",[["I had been waiting for an hour when she came.", "U kelganida men bir soatdan beri kutayotgan edim."], ["They had been working all night.", "Ular tun bo'yi ishlagan edi."], ["He was tired because he had been running.", "U yugurgani uchun charchagan edi."]],"Belgilari: for, since, how long, all day. Natija emas, jarayon muhim bo'lsa shu zamon ishlatiladi."],
["11. Present Perfect va Past Simple","have + V3   ≠   V2","Aniq o'tgan vaqt aytilsa (yesterday, in 2010, last week) — Past Simple. Vaqt aytilmasa yoki natija hozirga tegishli bo'lsa — Present Perfect.",[["I have lost my keys.", "Kalitlarimni yo'qotib qo'ydim (hozir ham yo'q)."], ["I saw him yesterday.", "Men uni kecha ko'rdim."], ["Have you ever been to London?", "Londonda bo'lganmisiz?"], ["I went to London in 2019.", "Men 2019-yilda Londonga bordim."]],"Yesterday, ago, last year, in 2015 bilan faqat Past Simple: I have seen him yesterday ❌."],
["12. Used to / would","used to + V · would + V","O'tmishdagi odat yoki holat, hozir esa yo'q. Used to — odat ham, holat ham; would — faqat takrorlanadigan odat. Inkor: didn't use to + V.",[["I used to play football.", "Men ilgari futbol o'ynardim."], ["She didn't use to like coffee.", "U ilgari qahvani yoqtirmasdi."], ["We would visit grandma every Sunday.", "Biz har yakshanba buvimnikiga borardik."], ["Did you use to live here?", "Siz ilgari shu yerda yashaganmidingiz?"]],"Did dan keyin use to (used emas). Holat uchun faqat used to: I used to be shy ✅, I would be shy ❌."],
["13. Future Simple: will","will + V","Kelajakdagi ish, va'da, o'sha zahoti qabul qilingan qaror yoki taxmin uchun. Inkor: won't (will not).",[["I will call you.","Men sizga qo'ng'iroq qilaman."],["It will rain tomorrow.","Ertaga yomg'ir yog'adi."],["I won't be late.","Men kechikmayman."]],"Belgilari: tomorrow, next week, soon, I think."],
["14. Be going to","am / is / are + going to + V","Oldindan rejalashtirilgan niyat yoki ko'rib turgan belgi asosidagi bashorat uchun.",[["I am going to study medicine.","Men tibbiyotni o'qimoqchiman."],["Look at the clouds! It is going to rain.","Bulutlarga qarang! Yomg'ir yog'adi."]],"Reja bo'lsa — going to. To'satdan qaror bo'lsa — will."],
["15. Future Continuous","will be + V-ing","Kelajakda aniq bir paytda davom etayotgan bo'ladigan ish. Muloyim savol berishda ham ishlatiladi.",[["At 8 tomorrow I will be working.", "Ertaga soat 8 da men ishlayotgan bo'laman."], ["This time next week we will be flying to Dubai.", "Kelasi hafta shu payt biz Dubayga uchib ketayotgan bo'lamiz."], ["Will you be using the car tonight?", "Bugun kechqurun mashinadan foydalanasizmi?"]],"Belgilari: at this time tomorrow, at 5 o'clock tomorrow, this time next week."],
["16. Future Perfect","will have + V3","Kelajakdagi ma'lum paytgacha tugab bo'lgan bo'ladigan ish.",[["I will have finished by Friday.", "Men juma kunigacha tugatib bo'lgan bo'laman."], ["She will have graduated by 2030.", "U 2030-yilgacha bitirgan bo'ladi."], ["Will you have done it by then?", "O'shagacha buni qilib bo'lgan bo'lasizmi?"]],"Belgilari: by Friday, by next year, by the time, before. By = «...gacha»."],
["17. Future Perfect Continuous","will have been + V-ing","Kelajakdagi paytga kelib, ish qancha vaqt davom etgan bo'lishini ta'kidlaydi. Amalda kam ishlatiladi.",[["By June I will have been working here for 5 years.", "Iyunga kelib men bu yerda 5 yil ishlagan bo'laman."], ["Next month they will have been living here for a year.", "Kelasi oy ular bu yerda bir yil yashagan bo'ladi."]],"Belgilari: by ... for + davr. Faqat davomiylikni ta'kidlash kerak bo'lganda ishlating."],
["18. Kelajak uchun Present zamonlari","Present Continuous · Present Simple","Present Continuous — oldindan kelishilgan aniq reja. Present Simple — jadval va dastur (poyezd, dars, kino) bo'yicha ish.",[["I'm meeting Ali tomorrow.", "Ertaga Ali bilan uchrashaman (kelishganmiz)."], ["The train leaves at 6 p.m.", "Poyezd soat 6 da jo'naydi."], ["The lesson starts at 9.", "Dars soat 9 da boshlanadi."], ["We are flying to Dubai on Friday.", "Biz juma kuni Dubayga uchamiz."]],"will — o'sha zahoti qaror, going to — niyat, Present Continuous — kelishilgan reja, Present Simple — jadval."],
["19. Artikllar: a / an / the","a + undosh · an + unli · the","a / an — «bitta» noaniq narsa, birinchi marta aytilganda. an unli tovushdan oldin keladi. the — aniq, ma'lum yoki dunyoda yagona narsa.",[["I have a car.","Mening mashinam bor."],["She eats an apple.","U olma yeydi."],["The car is red.","(O'sha) mashina qizil."],["The sun is hot.","Quyosh issiq."]],"Umumiy gapda artikl kerak emas: I like music."],
["20. Ko'plik (plural)","+s · +es · y → ies","Odatda oxiriga -s qo'shiladi. s, x, ch, sh bilan tugasa -es. Undosh + y bo'lsa y → ies.",[["book → books","kitoblar"],["box → boxes","qutilar"],["city → cities","shaharlar"],["man → men, child → children","erkaklar, bolalar"],["woman → women, person → people","ayollar, odamlar"]],"foot → feet, tooth → teeth kabi shakllarni yodlab oling."],
["21. Modal fe'llar","can / must / should / may + V","Modaldan keyin to'g'ridan-to'g'ri 1-shakl keladi (to va -s yo'q). can — qila olish, must — majburiyat, should — maslahat, may — ruxsat yoki ehtimol.",[["I can swim.","Men suza olaman."],["You must wear a seatbelt.","Siz xavfsizlik kamarini taqishingiz shart."],["You should sleep more.","Siz ko'proq uxlashingiz kerak."],["May I come in?","Kirsam maylimi?"]],"She can sings ❌ → She can sing ✅."],
["22. There is / There are","There is + birlik · There are + ko'plik","Biror narsa borligini aytish uchun. Birlikda is, ko'plikda are ishlatiladi.",[["There is a book on the table.","Stol ustida kitob bor."],["There are three chairs.","Uchta stul bor."],["Is there a bank near here?","Yaqin atrofda bank bormi?"]],"Inkor: There isn't / There aren't."],
["23. Solishtirish darajalari","+er than · more + sifat than · the +est","Ikki narsani solishtirishda: qisqa sifatga -er (bigger), uzun sifat oldiga more (more beautiful). Eng yuqori daraja: the + -est yoki the most.",[["This bag is cheaper than that one.","Bu sumka u sumkadan arzon."],["She is more careful than me.","U mendan ehtiyotkorroq."],["He is the tallest in class.","U sinfda eng baland."]],"Istisno: good → better → best, bad → worse → worst."],
["24. in / on / at (vaqt)","at + soat · on + kun · in + oy, yil","at — aniq vaqt (soat). on — hafta kunlari va sanalar. in — oy, yil, fasl va kun qismlari.",[["at 5 o'clock","soat 5 da"],["on Monday, on 5 May","dushanba kuni, 5-mayda"],["in July, in 2026, in winter","iyulda, 2026-yilda, qishda"],["in the morning","ertalab"]],"Istisno: at night, at the weekend."],
["25. some / any / much / many","many + sanaladigan · much + sanalmaydigan","Sanaladigan narsalar (kitob, olma) bilan many, sanalmaydigan (suv, vaqt) bilan much. some — darak gapda, any — inkor va savolda. a lot of — hammasi bilan.",[["I have some apples.","Menda bir nechta olma bor."],["Do you have any milk?","Sizda sut bormi?"],["How many books? / How much water?","Nechta kitob? / Qancha suv?"],["We don't have much time.","Bizda vaqt ko'p emas."]],"Taklif qilganda some ishlatiladi: Would you like some tea?"],
["26. Savol so'zlari","Savol so'zi + do/does/did + ega + V?","What — nima, Where — qayerda, When — qachon, Who — kim, Why — nega, How — qanday. Savol so'zi gap boshiga qo'yiladi, keyin yordamchi fe'l keladi.",[["What do you do?","Siz nima ish qilasiz?"],["Where does she live?","U qayerda yashaydi?"],["Why did you come?","Nega keldingiz?"],["Who called you?","Sizga kim qo'ng'iroq qildi?"]],"Who ega bo'lsa, do kerak emas: Who called you?"],
["27. Egalik","my · your · his · her · its · our · their · 's","my — meniki, your — sizniki, his — uniki (erkak), her — uniki (ayol), our — bizniki, their — ularniki. Ot bilan: Ali's book — Alining kitobi.",[["This is my bag.","Bu mening sumkam."],["Her name is Dilya.","Uning ismi Dilya."],["It's Ali's car.","Bu Alining mashinasi."]],"Egalik so'zi ot oldidan keladi: my book."],
["28. too va enough","too + sifat · sifat + enough · enough + ot","too — «ortiqcha, juda» (salbiy ma'noda). enough — «yetarli». Sifatdan keyin enough, otdan oldin enough keladi.",[["It's too hot to go out.", "Tashqariga chiqish uchun juda issiq."], ["He is old enough to drive.", "U mashina haydash uchun yetarlicha katta."], ["We don't have enough time.", "Bizda vaqt yetarli emas."], ["The tea is too sweet.", "Choy juda shirin (ortiqcha)."]],"too much + sanalmaydigan ot, too many + sanaladigan ot: too much sugar, too many cars."],
["29. have to / must","have to + V · don't have to + V · mustn't + V","have to — majburiyat (qoida yoki holat talab qiladi). don't have to — shart emas. mustn't — mumkin emas (taqiq).",[["I have to wake up early.","Men erta turishim kerak."],["You don't have to come.","Kelishingiz shart emas."],["You mustn't smoke here.","Bu yerda chekish mumkin emas."]],"don't have to ≠ mustn't. Bular boshqa-boshqa ma'no beradi!"],
["30. Zero Conditional","If + Present Simple, Present Simple","Doim to'g'ri bo'ladigan haqiqatlar va ilmiy qonunlar. If o'rniga when ham mumkin.",[["If you heat ice, it melts.", "Muzni qizdirsangiz, u eriydi."], ["If I don't sleep, I feel tired.", "Uxlamasam, charchagandek bo'laman."], ["Water boils if you heat it to 100°C.", "Suvni 100°C gacha qizdirsangiz, qaynaydi."]],"Ikkala qismda ham Present Simple, will ishlatilmaydi."],
["31. First Conditional","If + Present Simple, will + V","Kelajakda bo'lishi mumkin bo'lgan shart va uning natijasi. «Agar ... bo'lsa, ... bo'ladi».",[["If it rains, we will stay home.","Yomg'ir yog'sa, uyda qolamiz."],["If you study, you will pass.","O'qisangiz, o'tasiz."]],"If dan keyin will ishlatilmaydi: If it will rain ❌."],
["32. Second Conditional","If + Past Simple, would + V","Hozirgi yoki kelajakdagi xayoliy, real bo'lishi qiyin vaziyat. «Agar ... bo'lsa edi, ... bo'lardi».",[["If I had a million dollars, I would travel the world.", "Agar millionim bo'lsa edi, dunyoni aylanib chiqardim."], ["If I were you, I would study more.", "Sizning o'rningizda bo'lsam, ko'proq o'qirdim."], ["What would you do if you won the lottery?", "Lotereya yutsangiz nima qilardingiz?"]],"If dan keyin I/he/she/it bilan ko'pincha were: If I were rich ✅. If bo'limida would bo'lmaydi."],
["33. Third Conditional","If + Past Perfect, would have + V3","O'tmishdagi, o'zgartirib bo'lmaydigan voqea haqida afsus yoki taxmin. «Agar ... bo'lganida, ... bo'lardi».",[["If I had studied, I would have passed.", "Agar o'qiganimda, o'tgan bo'lardim."], ["If she hadn't been late, she would have caught the bus.", "Kechikmaganida, u avtobusga ulgurgan bo'lardi."], ["What would you have done if you had known?", "Bilganingizda nima qilgan bo'lardingiz?"]],"If bo'limida would have bo'lmaydi: If I would have known ❌ → If I had known ✅."],
["34. Wish (afsus va orzu)","wish + Past Simple · Past Perfect · would","Hozirgi holatdan norozilik — wish + Past Simple. O'tmishdagi afsus — wish + Past Perfect. Boshqaning odatidan noroziligi — wish + would.",[["I wish I had a car.", "Qaniydi mashinam bo'lsa."], ["I wish I were taller.", "Qaniydi bo'yim balandroq bo'lsa."], ["I wish I had studied harder.", "Qaniydi ko'proq o'qiganimda."], ["I wish you would stop talking.", "Qaniydi gapirishni to'xtatsangiz."]],"Wish dan keyin I/he/she bilan ham were ishlatiladi: I wish he were here."],
["35. Passive (majhul nisbat)","be + V3","Ishni kim qilgani muhim bo'lmasa yoki noma'lum bo'lsa, ish o'zi (nima bo'lgani) asosiy bo'ladi.",[["English is spoken everywhere.","Inglizcha hamma joyda gapiriladi."],["The house was built in 1990.","Uy 1990-yilda qurilgan."],["The letter will be sent tomorrow.","Xat ertaga yuboriladi."]],"be fe'li zamonni belgilaydi: is / was / will be + V3."],
["36. Passive: barcha zamonlar","be (zamonda) + V3","Majhul nisbatda be fe'li zamonni ko'rsatadi, asosiy fe'l esa doim V3 bo'ladi. Ish qiluvchi kerak bo'lsa by bilan aytiladi.",[["The car is washed every week.", "Mashina har hafta yuviladi. (Present Simple)"], ["The room is being cleaned now.", "Xona hozir tozalanyapti. (Present Continuous)"], ["The work has been done.", "Ish bajarildi. (Present Perfect)"], ["The letter was written yesterday.", "Xat kecha yozildi. (Past Simple)"], ["The bridge will be built next year.", "Ko'prik kelasi yil quriladi. (Future)"]],"Past Perfect: had been done · Past Continuous: was being done · modal: can be done."],
["37. Reported speech (ko'chirma gap)","said that + zamon bir pog'ona orqaga","Birovning gapini o'z so'zimiz bilan aytib berish. Asosiy fe'l o'tgan zamonda bo'lsa, gapdagi zamon bir pog'ona orqaga suriladi. Ega va payt so'zlari ham o'zgaradi.",[["He said, “I am tired.” → He said he was tired.", "U charchaganini aytdi."], ["“I will help you.” → She said she would help me.", "U menga yordam berishini aytdi."], ["“I have finished.” → He said he had finished.", "U tugatganini aytdi."], ["“Do you like tea?” → She asked if I liked tea.", "U mendan choy yoqtirishimni so'radi."]],"now → then, today → that day, tomorrow → the next day, here → there. Savolda if/whether yoki so'roq so'z, tartib oddiy gapdagidek."],
["38. Question tags (ajratilgan savol)","gap, + yordamchi fe'l + ega?","Gap oxirida tasdiqlash yoki fikrni so'rash uchun beriladigan qisqa savol. Gap darak bo'lsa tag inkor, gap inkor bo'lsa tag darak bo'ladi.",[["You are a student, aren't you?", "Siz talabasiz, shundaymi?"], ["She doesn't like tea, does she?", "U choyni yoqtirmaydi, a?"], ["They went home, didn't they?", "Ular uyga ketdi, shunday emasmi?"], ["Let's go, shall we?", "Ketaylik, mayli?"]],"I am → aren't I?; Let's → shall we?; buyruq (Open the door) → will you? Ovoz pasaysa — tasdiq, ko'tarilsa — haqiqiy savol."],
["39. Gerund va Infinitive","V-ing   /   to + V","Ba'zi fe'llardan keyin V-ing (enjoy, finish, mind, avoid, suggest), ba'zilaridan keyin to + V (want, decide, hope, plan, need) keladi. Ba'zilari ikkalasini ham oladi (like, love, start).",[["I enjoy reading.", "Men o'qishni yaxshi ko'raman."], ["She wants to learn English.", "U ingliz tilini o'rganishni xohlaydi."], ["He decided to leave.", "U ketishga qaror qildi."], ["Stop talking! · He stopped to talk.", "Gapirishni bas qiling! · U gaplashish uchun to'xtadi."]],"Predlogdan keyin faqat V-ing: interested in learning ✅. Stop, remember, forget dan keyin ma'no o'zgaradi."],
["40. Relative clauses (who, which, that)","ot + who / which / that + gap","Otni aniqlaydigan qo'shimcha gap. who — odam, which — narsa, that — odam va narsa, whose — egalik, where — joy.",[["The man who lives next door is a doctor.", "Qo'shni yashaydigan odam shifokor."], ["The book that I bought is interesting.", "Men sotib olgan kitob qiziqarli."], ["This is the girl whose brother is a pilot.", "Bu akasi uchuvchi bo'lgan qiz."], ["That's the café where we met.", "Bu biz uchrashgan kafe."]],"Agar who/which/that gapda ega bo'lmasa, tushirib qoldirish mumkin: The book I bought ✅."],
["41. Zamon gaplari: when, while, until","when · while · before · after · as soon as · until","Kelajak haqida gapirganda bu so'zlardan keyin will emas, Present Simple ishlatiladi.",[["I will call you when I arrive.", "Yetib borganimda sizga qo'ng'iroq qilaman."], ["Wait here until he comes.", "U kelguncha shu yerda kuting."], ["As soon as I finish, I will go home.", "Tugatishim bilan uyga ketaman."], ["While I was cooking, she was reading.", "Men ovqat pishirayotganimda, u kitob o'qiyotgan edi."]],"when I will arrive ❌ → when I arrive ✅. After/before dan keyin V-ing ham keladi: after eating."],
];
